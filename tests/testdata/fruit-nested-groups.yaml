- instance_name: concat( 'clementine', coalesce(${calc_elderberry}, 'blackberry'),
    '-', coalesce(${calc_grape}, 'passionfruit'), if(${num_jackfruit} != '', 'starfruit',
    if(${sel_lemon} != '', 'mulberry', if(${sel_grape} = 'honeydew' and ${sel_kiwi}
