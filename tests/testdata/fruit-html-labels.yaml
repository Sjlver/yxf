  required: yes
- type: end group
  name: grp_tangerine
- type: begin_group
  name: grp_ugli
  label: How many baskets did you fill this morning?
  relevant: ${sel_grape} = 'other'
- type: note
  name: note_mango
  label: <div style="font-size:24px; font-weight:bold; color:#8B0000; text-align:center;">Thank
    you for telling us about your fruit.</div>
- type: end_group
  name: grp_ugli
- type: begin group
  name: grp_vanilla
  label: Which fruit keeps the longest in your kitchen?
  relevant: ${sel_grape} = 'papaya'
- type: select_one banana_list
