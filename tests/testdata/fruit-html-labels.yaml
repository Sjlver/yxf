  label::Mandinka (mnk): Yiridiŋ jumaa le ka diyaa i ye?<div style="font-size:12px;
    color:#4D4D4D;">Yiridiŋ jelu le domota i la kunuŋ?</div>
  hint: Select all the fruit that applies.
  required: yes
- type: end group
  name: grp_raspberry
- type: begin_group
  name: grp_strawberry
  label: Is the fruit ripe today?
  relevant: ${sel_fig} = 'no'
- type: note
  name: note_lemon
  label: <div style="font-size:24px; font-weight:bold; color:#8B0000; text-align:center;">Remember
    that every answer stays confidential.</div>
- type: end_group
  name: grp_strawberry
- type: begin group
  name: grp_tangerine
  label: How much does a kilo of fruit cost here?
  relevant: ${sel_fig} = 'yes'
- type: select_one fig_list
  name: sel_grape
  label: Which fruit did you last share with a neighbour?
  label::Wolof (wo): Ban doom garab a sax ci sa tool?<div style="font-size:12px; color:#4D4D4D;">Ban
