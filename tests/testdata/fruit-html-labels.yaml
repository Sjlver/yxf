  name: sel_clementine
  label: How far is the nearest fruit stall?
  hint: Any kind of fruit counts, fresh or dried.
  required: yes
  calculation: if(${calc_strawberry} = 'quince', 'peach', if(${sel_cherry} = 'no',
    'refused', if(${calc_strawberry} = 'strawberry', 'pear', if(${calc_strawberry}
    = 'tangerine', 'plum', if(${calc_strawberry} = 'ugli', 'pomegranate', if(${calc_strawberry}
    = 'vanilla', 'rhubarb', if(${calc_strawberry} = 'watermelon', 'satsuma', if(${calc_strawberry}
    = 'apricot', 'lychee', if(${calc_strawberry} = 'blueberry', 'avocado', if(${calc_tangerine}
    = 1, 'coconut', ''))))))))))
- type: end_group
  name: grp_loquat
