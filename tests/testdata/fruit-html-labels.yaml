  label::Mandinka (mnk): Yiridiŋ jelu le domota i la kunuŋ?<div style="font-size:12px;
    color:#4D4D4D;">Yiridiŋ jumaa le ka faliŋ i la kunkoo to?</div>
  hint: Count only fruit that is ripe enough to eat.
  required: yes
- type: end group
  name: grp_vanilla
- type: begin_group
  name: grp_watermelon
  label: Which fruit is hardest to find at the market?
  relevant: ${sel_honeydew} = 'yes'
- type: note
  name: note_nectarine
  label: <div style="font-size:24px; font-weight:bold; color:#8B0000; text-align:center;">Please
