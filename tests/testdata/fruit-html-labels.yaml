survey:
- '#': A comment about fruit.
- type: begin_group
  name: grp_apple
  label: How many pieces of fruit did you eat yesterday?
- type: start
  name: start
- type: end
  name: end
- type: deviceid
  name: deviceid
- type: phonenumber
  name: devicephonenum
- type: username
  name: username
- type: text audit
  name: text_audit
  appearance: p=100;eventlog
- type: audio audit
  name: audio_audit
  appearance: p=100;s=note_fig;d=note_tangerine
- type: calculate
  name: calc_apple
  calculation: once(now())
- type: calculate
  name: calc_banana
  calculation: pulldata('apple', 'calc_banana', 'username', ${username})
- type: begin group
  name: grp_banana
  label: Was any fruit left over at the end of the day?
- type: begin group
  name: grp_cherry
  label: Which fruit keeps the longest in your kitchen?
  appearance: field-list
- type: select_one grape_list
  name: sel_apple
  label: How often do you eat fruit in a normal week?
  hint: Enter a whole number of pieces.
  required: yes
- type: text
  name: txt_apple
  label: Did you plant any new fruit trees this season?
  hint: Do not count fruit that has already spoiled.
- type: end_group
  name: grp_cherry
- type: select_one apple_list
  name: sel_banana
  label: How many people in this house like citrus fruit?
  hint: Read the whole list out loud before answering.
  required: yes
  appearance: search('banana', 'cherry', 'date, elderberry', ${txt_apple}, 'fig',
    ${sel_apple})
- type: calculate
  name: calc_cherry
  calculation: pulldata('banana', 'date', 'sel_banana', ${sel_banana})
- type: calculate
  name: calc_date
  calculation: pulldata('banana', 'grape', 'sel_banana', ${sel_banana})
- type: calculate
  name: calc_elderberry
  calculation: pulldata('banana', 'honeydew', 'sel_banana', ${sel_banana})
- type: calculate
  name: calc_fig
  calculation: pulldata('banana', 'fig', 'sel_banana', ${sel_banana})
- type: calculate
  name: calc_grape
  calculation: pulldata('banana', 'kiwi', 'sel_banana', ${sel_banana})
- type: calculate
  name: calc_honeydew
  calculation: pulldata('banana', 'lemon', 'sel_banana', ${sel_banana})
- type: begin_group
  name: grp_date
  label: Do you prefer sweet or sour fruit?
  appearance: field-list
- type: note
  name: note_apple
  label: |-
    <div style="font-size:24px; font-weight:bold; color:#006400; text-align:center;">Thank you for telling us about your fruit.</div>
    <br>
    <div style="font-size:18px;">
    <b>Please hand the tablet back to the interviewer.</b>This section is about the fruit you eat at home.<br/>
    <b>Take a moment before the next basket of questions.</b>Remember that every answer stays confidential.<br/>
    <b>Thank you for telling us about your fruit.</b>Please hand the tablet back to the interviewer.</div>
    <br>
    <div style="font-size:32px; font-weight:bold; color:#133c99; text-align:center; letter-spacing:2px;">This section is about the fruit you eat at home.</div>
- type: end group
  name: grp_date
- type: calculate
  name: calc_kiwi
  calculation: if(${calc_honeydew} = 'mango', 1, 0)
- type: end group
  name: grp_banana
- type: note
  name: note_banana
  label: Please hand the tablet back to the interviewer.
  hint: Any kind of fruit counts, fresh or dried.
- type: end_group
  name: grp_apple
- type: begin_group
  name: grp_elderberry
  label: Which fruit did you last share with a neighbour?
  relevant: ${calc_kiwi} = 0
- type: begin group
  name: grp_fig
  label: Would you like to taste a new kind of fruit?
  appearance: field-list
- type: note
  name: note_cherry
  label: This section is about the fruit you eat at home.<b>Take a moment before the
    next basket of questions.</b>Remember that every answer stays confidential.
  label::Wolof (wo): Jërëjëf ci say tontu.<div style="font-size:12px; color:#4D4D4D;">Jox
    tablet bi ci enquêteur bi.</div>
  label::Fula (ff): A jaaraama e jaabawol maa.<div style="font-size:12px; color:#4D4D4D;">Rutt
    tablet nden e lanndotooɗo on.</div>
  label::Mandinka (mnk): I ning baraka i la jaabiroo la.<div style="font-size:12px;
    color:#4D4D4D;">Tablet be murundi ñininnaa ma.</div>
  hint: Do not count fruit that has already spoiled.
- type: select_one banana_list
  name: sel_cherry
  label: How many baskets did you fill this morning?
  label::Wolof (wo): Ban doom garab nga gën a bëgg?<div style="font-size:12px; color:#4D4D4D;">Ñaata
    doom garab nga lekk démb?</div>
  label::Fula (ff): Hol ɓiɗɗo leggal ngal mbeleɗaa?<div style="font-size:12px; color:#4D4D4D;">Ɓiɗɗe
    leggal no foti nyaamɗaa hanki?</div>
  label::Mandinka (mnk): Yiridiŋ jumaa le ka diyaa i ye?<div style="font-size:12px;
    color:#4D4D4D;">Yiridiŋ jelu le domota i la kunuŋ?</div>
  required: yes
- type: end group
  name: grp_fig
- type: begin_group
  name: grp_grape
  label: Which fruit keeps the longest in your kitchen?
  relevant: ${sel_cherry} = 'no'
  appearance: field-list
- type: note
  name: note_date
  label: |-
    <div style="font-size:24px; font-weight:bold; color:#8B0000; text-align:center;">Take a moment before the next basket of questions.</div>
    <br>

    <div style="font-size:18px;">Remember that every answer stays confidential.</div>
- type: end_group
  name: grp_grape
- type: calculate_here
  name: calc_lemon
  calculation: once(format-date-time(now(), '%Y-%b-%e %H:%M:%S'))
- type: end group
  name: grp_elderberry
- type: begin group
  name: grp_honeydew
  label: How many people in this house like citrus fruit?
  relevant: ${sel_cherry} = 'yes'
  appearance: field-list
- type: geopoint
  name: geo_apple
  label: Is there a fruit you have never tried?
  hint: Enter a whole number of pieces.
  required: yes
- type: end_group
  name: grp_honeydew
- type: begin_group
  name: grp_kiwi
  label: How far is the nearest fruit stall?
  relevant: ${sel_cherry}='yes'
- type: note
  name: note_elderberry
  label: |-
    <div style="font-size:18px;">
    <b>Remember that every answer stays confidential.</b><br>Thank you for telling us about your fruit.</div>
  label::Wolof (wo): |-
    <div style="font-size:18px;">
    <b>Jërëjëf ci say tontu.</b><br>Jox tablet bi ci enquêteur bi.</div>

    <div style="font-size:12px; color:#4D4D4D;">Jërëjëf ci say tontu.</div>
  label::Fula (ff): |-
    <div style="font-size:18px;">
    <b>A jaaraama e jaabawol maa.</b><br>Rutt tablet nden e lanndotooɗo on.</div>

    <div style="font-size:12px; color:#4D4D4D;">A jaaraama e jaabawol maa.</div>
  label::Mandinka (mnk): |-
    <div style="font-size:18px;">
    <b>I ning baraka i la jaabiroo la.</b><br>Tablet be murundi ñininnaa ma.</div>

    <div style="font-size:12px; color:#4D4D4D;">I ning baraka i la jaabiroo la.</div>
- type: calculate
  name: calc_mango
  calculation: if(${calc_date} != '', int(${calc_date}), if(${calc_elderberry} !=
    '', int((today() - date(${calc_elderberry})) div 365.25), ''))
- type: begin group
  name: grp_lemon
  label: How many pieces of fruit did you eat yesterday?
  appearance: field-list
- type: note
  name: note_fig
  label: |-
    <div style="font-size:18px;">
    <b>Thank you for telling us about your fruit.</b>Please hand the tablet back to the interviewer.</div>
  relevant: ${calc_mango} != ''
- type: select_one banana_list
  name: sel_date
  label: Which fruit grows in your garden?
  hint: If you are not sure, give your best estimate.
  required: yes
  relevant: ${calc_mango} != ''
- type: end group
  name: grp_lemon
- type: integer
  name: num_apple
  label: How many fruit trees are on this plot?
  label::Wolof (wo): Ban doom garab a sax ci sa tool?<div style="font-size:12px; color:#4D4D4D;">Ban
    doom garab nga gën a bëgg?</div>
  label::Fula (ff): Hol ɓiɗɗo leggal fuɗata e ngesa maa?<div style="font-size:12px;
    color:#4D4D4D;">Hol ɓiɗɗo leggal ngal mbeleɗaa?</div>
  label::Mandinka (mnk): Yiridiŋ jumaa le ka faliŋ i la kunkoo to?<div style="font-size:12px;
    color:#4D4D4D;">Yiridiŋ jumaa le ka diyaa i ye?</div>
  hint: Ask the person who does the shopping.
  required: yes
  relevant: ${calc_mango} = '' or ${sel_date} = 'no'
  constraint: . >= 10 and . <= 60
  constraint_message: That is more fruit than we expected. Please check the number.
- type: calculate
  name: calc_nectarine
  calculation: if(${num_apple} != '' and ${calc_mango} != '', if(${num_apple} < ${calc_mango},
    ${num_apple}, ${calc_mango}), if(${num_apple} != '', ${num_apple}, ${calc_mango}))
- type: calculate
  name: calc_orange
  calculation: if(${calc_nectarine} != '' and ${calc_nectarine} >= 18, 1, 0)
- type: begin_group
  name: grp_mango
  label: How much does a kilo of fruit cost here?
  relevant: ${calc_orange} = 0
- type: note
  name: note_grape
  label: <div style="font-size:24px; font-weight:bold; color:#8B0000; text-align:center;">Please
    hand the tablet back to the interviewer.</div>
- type: end_group
  name: grp_mango
- type: begin group
  name: grp_nectarine
  label: Would you like to taste a new kind of fruit?
  relevant: ${calc_orange} = 1
- type: integer
  name: num_banana
  label: How many baskets did you fill this morning?
  label::Wolof (wo): Ban doom garab a sax ci sa tool?<div style="font-size:12px; color:#4D4D4D;">Ban
    doom garab nga gën a bëgg?</div>
  label::Fula (ff): Hol ɓiɗɗo leggal fuɗata e ngesa maa?<div style="font-size:12px;
    color:#4D4D4D;">Hol ɓiɗɗo leggal ngal mbeleɗaa?</div>
  label::Mandinka (mnk): Yiridiŋ jumaa le ka faliŋ i la kunkoo to?<div style="font-size:12px;
    color:#4D4D4D;">Yiridiŋ jumaa le ka diyaa i ye?</div>
  hint: If you are not sure, give your best estimate.
  required: yes
  constraint: . >= 0 and . <= 60
- type: end group
  name: grp_nectarine
- type: calculate
  name: calc_papaya
  calculation: if(${calc_grape} != '', int(today() - date(${calc_grape})), '')
- type: calculate
  name: calc_quince
  calculation: if(${calc_papaya} != '', ${calc_papaya}, ${num_banana})
- type: calculate
  name: calc_raspberry
  calculation: if(${calc_quince} != '' and ${calc_quince} >= 0 and ${calc_quince}
    <= 28, 1, 0)
- type: begin_group
  name: grp_orange
  label: Which fruit is hardest to find at the market?
  relevant: ${calc_orange} = 1 and ${calc_raspberry} = 0
- type: note
  name: note_honeydew
  label: <div style="font-size:24px; font-weight:bold; color:#8B0000; text-align:center;">This
    section is about the fruit you eat at home.</div>
- type: end_group
  name: grp_orange
- type: begin group
  name: grp_papaya
  label: Is there a fruit you have never tried?
  relevant: ${calc_raspberry} = 1
- type: select_one elderberry_list
  name: sel_elderberry
  label: Which fruit do the children ask for most?
  label::Wolof (wo): Ñaata doom garab nga lekk démb?<div style="font-size:12px; color:#4D4D4D;">Ban
    doom garab a sax ci sa tool?</div>
  label::Fula (ff): Ɓiɗɗe leggal no foti nyaamɗaa hanki?<div style="font-size:12px;
    color:#4D4D4D;">Hol ɓiɗɗo leggal fuɗata e ngesa maa?</div>
  label::Mandinka (mnk): Yiridiŋ jelu le domota i la kunuŋ?<div style="font-size:12px;
    color:#4D4D4D;">Yiridiŋ jumaa le ka faliŋ i la kunkoo to?</div>
  hint: If you are not sure, give your best estimate.
  required: yes
- type: end group
  name: grp_papaya
- type: begin_group
  name: grp_quince
  label: What is your favorite fruit?
  relevant: ${sel_elderberry} = 'nectarine'
- type: note
  name: note_kiwi
  label: <div style="font-size:24px; font-weight:bold; color:#8B0000; text-align:center;">Take
    a moment before the next basket of questions.</div>
- type: end_group
  name: grp_quince
- type: begin group
  name: grp_raspberry
  label: Which fruit grows in your garden?
  relevant: ${sel_elderberry} = 'orange'
- type: select_one banana_list
  name: sel_fig
  label: Do you prefer sweet or sour fruit?
  label::Wolof (wo): Ban doom garab nga gën a bëgg?<div style="font-size:12px; color:#4D4D4D;">Ñaata
    doom garab nga lekk démb?</div>
  label::Fula (ff): Hol ɓiɗɗo leggal ngal mbeleɗaa?<div style="font-size:12px; color:#4D4D4D;">Ɓiɗɗe
