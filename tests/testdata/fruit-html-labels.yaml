  relevant: ${calc_tangerine} = 0
- type: end group
  name: grp_kiwi
- type: calculate
  name: calc_strawberry
  calculation: if(${calc_kiwi} = 1, 'quince', if(${sel_cherry} != 'yes', 'raspberry',
    if(${calc_orange} = 0, 'strawberry', if(${calc_raspberry} = 0, 'tangerine', if(${sel_elderberry}
    = 'nectarine', 'ugli', if(${sel_fig} = 'no', 'vanilla', if(${sel_grape} = 'other',
    'watermelon', if(${sel_honeydew} = 'yes', 'apricot', if(${sel_kiwi} = 'no', 'blueberry',
    'calc_tangerine')))))))))
- type: calculate
  name: calc_tangerine
  calculation: if(${calc_strawberry} = 'calc_tangerine', 1, 0)
- type: begin group
  name: grp_cranberry
  label: Is the fruit ripe today?
  relevant: ${calc_tangerine} = 1
- type: note
  name: note_quince
  label: |-
